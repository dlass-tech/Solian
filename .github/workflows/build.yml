name: Build Release
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - web
          - windows
          - linux
          - android
        include:
          - platform: web
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: android
            os: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libayatana-appindicator3-dev keybinder-3.0 libnotify-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer-1.0 libsecret-1-dev zip curl unzip

      - name: Accept Android SDK Licenses & Install NDK
        if: matrix.platform == 'android'
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13113456"

      - name: Restore Android Signing Files
        if: matrix.platform == 'android'
        run: |
          echo "${{ secrets.ANDROID_KEY_PROPS }}" > android/key.properties
          mkdir -p android/app/keystore
          echo "${{ secrets.ANDROID_DC_JKS_BASE64 }}" | base64 -d > android/app/keystore/dc.jks

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        if: matrix.platform == 'web'
        run: flutter build web --release

      - name: Build Windows Release
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build Linux Release
        if: matrix.platform == 'linux'
        run: flutter build linux --no-tree-shake-icons --release

      - name: Build Android Signed Release
        if: matrix.platform == 'android'
        run: flutter build apk --release --split-per-abi

      - name: Extract Version Info
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -match 'version:\s*(\d+\.\d+\.\d+)\+(\d+)') {
            $appVersion = $matches[1]
            $buildNumber = $matches[2]
            Write-Host "app_version=$appVersion" >> $env:GITHUB_OUTPUT
            Write-Host "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          }

      - name: Build Windows Installer
        if: matrix.platform == 'windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: "/DAppVersion=${{ steps.extract_version.outputs.app_version }} /DBuildNumber=${{ steps.extract_version.outputs.build_number }}"

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          rm -rf Solian.AppDir || true
          mkdir -p Solian.AppDir
          cp -r build/linux/x64/release/bundle/* Solian.AppDir
          [ -d buildtools/appimage_config ] && cp -r buildtools/appimage_config/* Solian.AppDir
          [ -f assets/icons/icon-padded.png ] && cp assets/icons/icon-padded.png Solian.AppDir
          chmod +x buildtools/appimagetool-x86_64.AppImage
          chmod +x Solian.AppDir/AppRun
          ./buildtools/appimagetool-x86_64.AppImage Solian.AppDir

      - name: Compress Windows Portable
        if: matrix.platform == 'windows'
        shell: powershell
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "windows-portable.zip" -Force

      - name: Compress Linux Bundle
        if: matrix.platform == 'linux'
        run: zip -r linux-bundle.zip build/linux/x64/release/bundle/

      - name: Upload Web Build Artifact
        if: matrix.platform == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-web
          path: build/web

      - name: Upload Windows Installer Artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows-installer
          path: Installer/windows-x86_64-setup.exe

      - name: Upload Windows Portable Zip Artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: windows-portable.zip

      - name: Upload Linux AppImage Artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-linux-appimage
          path: ./*.AppImage*

      - name: Upload Linux Bundle Zip Artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle-zip
          path: linux-bundle.zip

      - name: Upload Android Signed APK Artifact
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-android-signed
          path: build/app/outputs/flutter-apk/

      # ========== 用AWS CLI兼容R2上传 ==========
      - name: Install AWS CLI (Linux)
        if: matrix.platform != 'windows' && matrix.platform != 'web'
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Install AWS CLI (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          choco install awscli -y

      - name: Configure AWS Credentials for R2
        if: matrix.platform != 'web'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $AWS_DEFAULT_REGION

      - name: Upload Windows Files to R2
        if: matrix.platform == 'windows'
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 cp Installer/windows-x86_64-setup.exe s3://$env:R2_BUCKET/solian/windows-x86_64-setup.exe --endpoint-url $env:R2_ENDPOINT
          aws s3 cp windows-portable.zip s3://$env:R2_BUCKET/solian/windows-portable.zip --endpoint-url $env:R2_ENDPOINT

      - name: Upload Linux Files to R2
        if: matrix.platform == 'linux'
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 cp Solian.AppImage s3://$R2_BUCKET/solian/Solian.AppImage --endpoint-url $R2_ENDPOINT
          aws s3 cp linux-bundle.zip s3://$R2_BUCKET/solian/linux-bundle.zip --endpoint-url $R2_ENDPOINT

      - name: Upload Android Files to R2
        if: matrix.platform == 'android'
        continue-on-error: true
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          aws s3 cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk s3://$R2_BUCKET/solian/app-arm64-v8a-release.apk --endpoint-url $R2_ENDPOINT
          aws s3 cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk s3://$R2_BUCKET/solian/app-armeabi-v7a-release.apk --endpoint-url $R2_ENDPOINT
          aws s3 cp build/app/outputs/flutter-apk/app-x86_64-release.apk s3://$R2_BUCKET/solian/app-x86_64-release.apk --endpoint-url $R2_ENDPOINT
