name: Build Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - web
          - windows
          - linux
          - android
        include:
          - platform: web
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: android
            os: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libayatana-appindicator3-dev keybinder-3.0 libnotify-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer-1.0 libsecret-1-dev

      # ========== 修复Android NDK许可 + 依赖 ==========
      - name: Accept Android SDK Licenses & Install NDK
        if: matrix.platform == 'android'
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13113456"

      # 精准还原你的安卓签名文件
      - name: Restore Android Signing Files
        if: matrix.platform == 'android'
        run: |
          echo "${{ secrets.ANDROID_KEY_PROPS }}" > android/key.properties
          mkdir -p android/app/keystore
          echo "${{ secrets.ANDROID_DC_JKS_BASE64 }}" | base64 -d > android/app/keystore/dc.jks

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        if: matrix.platform == 'web'
        run: flutter build web --release

      - name: Build Windows Release
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build Linux Release
        if: matrix.platform == 'linux'
        run: flutter build linux --no-tree-shake-icons --release

      - name: Build Android Signed Release
        if: matrix.platform == 'android'
        run: flutter build apk --release --split-per-abi

      # Windows 版本解析 & 安装包
      - name: Extract Version Info
        if: matrix.platform == 'windows'
        id: extract_version
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -match 'version:\s*(\d+\.\d+\.\d+)\+(\d+)') {
            $appVersion = $matches[1]
            $buildNumber = $matches[2]
            Write-Host "app_version=$appVersion" >> $env:GITHUB_OUTPUT
            Write-Host "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          }

      - name: Build Windows Installer
        if: matrix.platform == 'windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: "/DAppVersion=${{ steps.extract_version.outputs.app_version }} /DBuildNumber=${{ steps.extract_version.outputs.build_number }}"

      # Linux AppImage 打包
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          rm -rf Solian.AppDir || true
          mkdir -p Solian.AppDir
          cp -r build/linux/x64/release/bundle/* Solian.AppDir
          [ -d buildtools/appimage_config ] && cp -r buildtools/appimage_config/* Solian.AppDir
          [ -f assets/icons/icon-padded.png ] && cp assets/icons/icon-padded.png Solian.AppDir
          chmod +x buildtools/appimagetool-x86_64.AppImage
          chmod +x Solian.AppDir/AppRun
          ./buildtools/appimagetool-x86_64.AppImage Solian.AppDir

      # 全部产物上传
      - name: Upload Web Build
        if: matrix.platform == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-web
          path: build/web

      - name: Upload Windows Build
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows
          path: build/windows/x64/runner/Release

      - name: Upload Windows Installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows-installer
          path: Installer/windows-x86_64-setup.exe

      - name: Upload Linux Bundle
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-linux
          path: build/linux/x64/release/bundle

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-linux-appimage
          path: "./*.AppImage*"

      - name: Upload Android Signed APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-android-signed
          path: build/app/outputs/flutter-apk/
